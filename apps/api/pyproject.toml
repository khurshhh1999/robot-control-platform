[project]
name = "robot-control-platform-api"
version = "0.1.0"
description = "HTTP API package for the robot control platform."
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "robot-control-platform-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_control_platform_api"]

[tool.uv.sources]
robot-control-platform-common = { workspace = true }
